<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Country Name Filter</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./example.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="page-header">
      <p class="eyebrow">Day 25 · Added activity</p>
      <h1>Country name filter</h1>
      <p class="intro">Search a small local country list by name.</p>
    </header>

    <section class="filter-panel" aria-labelledby="filter-title">
      <h2 id="filter-title">Find a country</h2>
      <label for="country-search">Country name</label>
      <input id="country-search" type="search" autocomplete="off" placeholder="Try ia">
      <p id="match-count" role="status" aria-live="polite"></p>
      <p id="empty-state" role="status" aria-live="polite" hidden></p>
      <ul id="country-list" aria-label="Matching countries"></ul>
    </section>
  </main>
</body>
</html>
