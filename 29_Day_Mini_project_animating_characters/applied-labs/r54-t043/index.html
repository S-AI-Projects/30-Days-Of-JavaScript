<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Search and sort characters</title>
  </head>
  <body>

      <h1>Search and sort characters</h1>
